# Floe Docker Compose stack
#
# Brings up a "proper" Floe deployment locally:
#   - minio      : S3-compatible object store (the Iceberg warehouse)
#   - postgres   : backing store for the PyIceberg SQL catalog
#   - floe-seed  : one-shot, loads the quickstart bronze tables
#   - floe-apply : one-shot, materialises the dynamic tables
#   - floe-watch : long-running worker, refreshes DITs as upstreams change
#
# Usage:
#   cp .env.example .env      # then edit secrets if you like
#   docker compose up --build
#
#   # Optional, experimental: also run Flink against the same Iceberg tables
#   docker compose --profile flink up --build
#
#   # Optional: a browser SQL workbench (Trino + Metabase) over Floe's tables
#   docker compose --profile sql up -d
#
# MinIO console: http://localhost:9001  (login with the .env credentials)
# Flink dashboard (flink profile): http://localhost:8081
# SQL workbench (sql profile): http://localhost:3000 (Metabase), :8080 (Trino)

name: floe

# Shared Floe runtime config (12-factor: catalog + object store via env).
x-floe-env: &floe-env
  FLOE_CATALOG_TYPE: sql
  FLOE_CATALOG_URI: "postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}"
  FLOE_WAREHOUSE: "s3://${FLOE_BUCKET}/wh"
  FLOE_S3_ENDPOINT: "http://minio:9000"
  FLOE_S3_ACCESS_KEY_ID: "${MINIO_ROOT_USER}"
  FLOE_S3_SECRET_ACCESS_KEY: "${MINIO_ROOT_PASSWORD}"
  FLOE_S3_REGION: "us-east-1"

x-floe-build: &floe-build
  build:
    context: .
    dockerfile: Dockerfile

# Flink image (stock Flink + Iceberg/S3/Postgres jars). Only used by the opt-in
# `flink` profile; `docker compose up` without that profile never builds it.
x-flink-image: &flink-image
  build:
    context: ./docker/flink
    dockerfile: Dockerfile

# Connection settings the one-shot Flink SQL demo needs to reach Floe's catalog
# and warehouse. Note the JDBC URI is the plain Java form (not the SQLAlchemy
# `postgresql+psycopg2://` form PyIceberg uses).
x-flink-catalog-env: &flink-catalog-env
  FLINK_JOBMANAGER_HOST: flink-jobmanager
  FLINK_JDBC_URI: "jdbc:postgresql://postgres:5432/${POSTGRES_DB}"
  POSTGRES_USER: "${POSTGRES_USER}"
  POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
  FLOE_WAREHOUSE: "s3://${FLOE_BUCKET}/wh"
  FLOE_S3_ENDPOINT: "http://minio:9000"
  FLOE_S3_ACCESS_KEY_ID: "${MINIO_ROOT_USER}"
  FLOE_S3_SECRET_ACCESS_KEY: "${MINIO_ROOT_PASSWORD}"
  FLOE_S3_REGION: "us-east-1"
  # Must match Floe's project name so Flink's JdbcCatalog resolves the same rows.
  FLOE_CATALOG_NAME: quickstart

services:
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD}"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  # Create the warehouse bucket once MinIO is reachable. Retries until ready,
  # so MinIO needs no healthcheck of its own.
  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD; do
        echo 'waiting for minio...'; sleep 2;
      done;
      mc mb --ignore-existing local/$$FLOE_BUCKET;
      echo bucket ready: $$FLOE_BUCKET;
      "
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD}"
      FLOE_BUCKET: "${FLOE_BUCKET}"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: "${POSTGRES_DB}"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: seed the bronze source tables into the catalog/warehouse.
  floe-seed:
    <<: *floe-build
    environment:
      <<: *floe-env
      # Optional performance-test knob: 0 (default) seeds the small curated
      # quickstart dataset; a positive value generates that many synthetic,
      # FK-consistent delivery rows (with proportional safety events/defects).
      FLOE_SEED_DELIVERIES: "${FLOE_SEED_DELIVERIES:-0}"
      FLOE_SEED_DAYS: "${FLOE_SEED_DAYS:-30}"
      FLOE_SEED_DAS: "${FLOE_SEED_DAS:-2000}"
      FLOE_SEED_ROUTES: "${FLOE_SEED_ROUTES:-800}"
      FLOE_SEED_SAFETY_PCT: "${FLOE_SEED_SAFETY_PCT:-8}"
      FLOE_SEED_DEFECT_PCT: "${FLOE_SEED_DEFECT_PCT:-4}"
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    entrypoint: ["python"]
    command: ["examples/quickstart/seed_sources.py"]
    restart: "no"

  # One-shot: materialise every dynamic table for the first time.
  floe-apply:
    <<: *floe-build
    environment: *floe-env
    depends_on:
      floe-seed:
        condition: service_completed_successfully
    command: ["apply", "-c", "examples/quickstart/floe.yaml"]
    restart: "no"

  # Long-running worker: keep DITs fresh as upstreams receive new snapshots.
  floe-watch:
    <<: *floe-build
    environment: *floe-env
    depends_on:
      floe-apply:
        condition: service_completed_successfully
    command: ["watch", "--no-ui", "-c", "examples/quickstart/floe.yaml", "--poll", "10"]
    restart: unless-stopped

  # --- Experimental Flink profile (opt-in) ----------------------------------
  # Demonstrates a second engine operating on the SAME Iceberg tables Floe
  # manages: Flink reads a Floe-authored silver table and writes a gold rollup
  # back into the shared catalog. Floe's own refresh engine is still DuckDB; this
  # is a preview of the roadmap's Flink-based compute, not a replacement for it.
  #
  # Start with:  docker compose --profile flink up --build
  # (the core services above still run; the flink-* services are added on top.)
  flink-jobmanager:
    <<: *flink-image
    profiles: ["flink"]
    command: jobmanager
    ports:
      - "8081:8081"
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8081/overview || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  flink-taskmanager:
    <<: *flink-image
    profiles: ["flink"]
    command: taskmanager
    depends_on:
      flink-jobmanager:
        condition: service_started
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 2

  # One-shot: run the Flink SQL demo once the cluster is up and Floe has applied
  # its tables (so silver.deliveries_enriched exists to read from).
  flink-sql:
    <<: *flink-image
    profiles: ["flink"]
    environment: *flink-catalog-env
    depends_on:
      flink-jobmanager:
        condition: service_healthy
      floe-apply:
        condition: service_completed_successfully
    entrypoint: ["/opt/floe/run-demo.sh"]
    restart: "no"

  # --- Container observability UI (opt-in) -----------------------------------
  # A lightweight, read-only web dashboard for watching every container in this
  # Compose project in real time: live, searchable logs and CPU / memory / network
  # stats, grouped by Compose service. Useful when you run the engine headless
  # (for example Docker Engine in WSL2) and so don't have Docker Desktop's own
  # Compose view. It only needs the Docker socket mounted read-only; it manages
  # nothing and stores nothing.
  #
  # Start with:  docker compose --profile ui up -d dozzle
  # Then open:   http://localhost:8888
  # Combine with other profiles, e.g.:  docker compose --profile flink --profile ui up
  dozzle:
    image: amir20/dozzle:latest
    profiles: ["ui"]
    environment:
      DOZZLE_NO_ANALYTICS: "true"
    ports:
      - "8888:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  # --- SQL workbench profile (opt-in) ----------------------------------------
  # A browser-based SQL workbench over the EXACT Iceberg tables Floe manages, so
  # you can query them like a database (ad-hoc SQL, row previews, snapshot
  # metadata, time travel) instead of reading raw Parquet blobs in the MinIO
  # console. Two off-the-shelf, open-source pieces; no Floe-specific code:
  #   - trino    : query engine. Its Iceberg connector points at the SAME
  #                Postgres catalog and MinIO warehouse the rest of the stack
  #                uses (docker/trino/catalog/iceberg.properties). UI on :8080.
  #   - metabase : web SQL editor + charts; ships a Starburst (Trino) driver.
  #
  # Start with:  docker compose --profile sql up -d
  # Then open:   http://localhost:3000  (Metabase)
  #         and  http://localhost:8080  (Trino's own query UI)
  # First run only: in Metabase, add a database of type "Starburst" with host
  #   `trino`, port `8080`, catalog `iceberg`, username `metabase`, no password.
  # Combine with other profiles, e.g.:  docker compose --profile sql --profile ui up
  trino:
    image: trinodb/trino:468
    profiles: ["sql"]
    environment:
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: "${POSTGRES_DB}"
      FLOE_BUCKET: "${FLOE_BUCKET}"
      MINIO_ROOT_USER: "${MINIO_ROOT_USER}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD}"
    ports:
      - "8080:8080"
    volumes:
      - ./docker/trino/catalog:/etc/trino/catalog:ro
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/v1/info | grep -q '\"starting\":false' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s

  metabase:
    image: metabase/metabase:latest
    profiles: ["sql"]
    environment:
      # Persist Metabase's own app DB (users, saved questions, and the Trino
      # connection) to a volume so the one-time first-run setup survives restarts.
      MB_DB_FILE: /metabase-data/metabase.db
    ports:
      - "3000:3000"
    volumes:
      - metabase-data:/metabase-data
    depends_on:
      trino:
        condition: service_healthy

volumes:
  minio-data:
  postgres-data:
  metabase-data:
