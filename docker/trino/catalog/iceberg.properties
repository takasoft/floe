# Trino catalog: read Floe's Iceberg tables over the SAME Postgres-backed
# PyIceberg catalog and MinIO warehouse the rest of the stack uses.
#
# Used only by the opt-in `sql` profile (docker compose --profile sql up).
# Secrets come from your .env via Trino's ${ENV:...} substitution, so nothing
# sensitive is hard-coded here. The catalog name MUST match Floe's project
# (examples/quickstart/floe.yaml -> project: quickstart) so Trino's JDBC
# catalog resolves the very same rows PyIceberg wrote.
connector.name=iceberg
iceberg.catalog.type=jdbc
iceberg.jdbc-catalog.catalog-name=quickstart
iceberg.jdbc-catalog.driver-class=org.postgresql.Driver
iceberg.jdbc-catalog.connection-url=jdbc:postgresql://postgres:5432/${ENV:POSTGRES_DB}
iceberg.jdbc-catalog.connection-user=${ENV:POSTGRES_USER}
iceberg.jdbc-catalog.connection-password=${ENV:POSTGRES_PASSWORD}
iceberg.jdbc-catalog.default-warehouse-dir=s3://${ENV:FLOE_BUCKET}/wh
fs.native-s3.enabled=true
s3.endpoint=http://minio:9000
s3.path-style-access=true
s3.region=us-east-1
s3.aws-access-key=${ENV:MINIO_ROOT_USER}
s3.aws-secret-key=${ENV:MINIO_ROOT_PASSWORD}
